Config:
  Console: false              # Show console window.
  ShaderLoader: true          # Use build in shader loader, place shaders in the game\shaders folder.
  ShaderCompiler: false       # Enable shader compiler, place shader sources in the game\fx folder.
  X360Effects: false          # Enable light trails.
  LiveReload: false           # Live reload config files when game loses focus.
  Editor: false               # Enable UI for editing.
  SkipFE: false               # Allows to enter game faster by skipping all the frontend.
  CarVinylPaintFix: true      # Make vinyls to not be affected by car paint.
  BrakeGlow: true             # Enable brake rotor glow.
  
Time:
  ForceTime: -1.0             # Foce specific time of day from 0.0 to 1.0, negative values disable feature.
  TimeUpdateRate: 1.0         # Update rate for the game time, 1.0 is vanilla rate.
  LightsOn: 0.77              # Time when world lights are enabled.
  LightsOff: 0.27             # Time when world lights are disabled.
  WetTime: 2.0            # Time for the road to get fully wet.
  DryTime: 30.0               # Time for the road to get fully dry.
  RandomStartupTime: false    # Random game time at start.
  RealTime: false             # Use real time from PC in the game.

Blur:
  MinSpeed: 25.0              # Minimum speed for blur to activate.
  MaxSpeed: 325.0             # Speed at wich blur get maximum strenght.
  Depth: 150.0                # Maximum distance for object to be affected by blur.

Hotkeys:
  ShaderReload: 0             # Hot key to live recompile and reload shaders, source code needs to be placed in game\fx folder.
  ToggleEditor: 114           # Hot key to toggle UI Editor visibility (F3 by default).